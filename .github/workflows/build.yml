name: Build WordQuiz Pro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pwa:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze
        run: npm install

      - name: Prepara sintesi vocale
        run: npm run build:tts

      - name: Aggiorna versione cache
        run: sed -i "s/wordquiz-v1/wordquiz-${GITHUB_SHA::8}/" www/sw.js

      - name: Carica artefatto PWA
        uses: actions/upload-artifact@v4
        with:
          name: WordQuizPro-PWA-ZIP
          path: www
          if-no-files-found: error

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara pubblicazione GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Pubblica GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installa dipendenze
        run: npm install

      - name: Prepara sintesi vocale
        run: npm run build:tts

      - name: Aggiungi Android
        run: npx cap add android

      - name: Imposta versionCode
        run: sed -i -E "s/versionCode[ =]+1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle

      - name: Genera risorse Android
        run: npx capacitor-assets generate --android

      - name: Sincronizza Capacitor
        run: npx cap sync android

      - name: Compila APK di prova
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      

      - name: Carica APK Android di prova
        uses: actions/upload-artifact@v4
        with:
          name: WordQuizPro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
        

      - name: Installa dipendenze
        run: npm install

      - name: Genera bundle della sintesi vocale
        run: npm run build:tts

      - name: Verifica Electron
        run: npx electron --version

      - name: Compila Windows
        run: npx electron-builder --win --x64 --publish never

      - name: Carica programmi Windows
        uses: actions/upload-artifact@v4
        with:
          name: WordQuizPro-Windows
          path: dist/*.exe
          if-no-files-found: error
